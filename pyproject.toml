[project]
name = "velo"
version = "0.1.0"
description = "Disponibilité des VélôToulouse : analyse, prédiction et effet de la pluie"
authors = [
    { name = "batistefnl" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.3",
    "joblib>=1.4.2",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    "requests>=2.32.3",
    "scikit-learn>=1.6.0",
    "statsmodels>=0.14.4",
    "streamlit>=1.41.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.3",
]

[tool.uv]
# figé à la fin de l'étude pour pouvoir refaire le lock
exclude-newer = "2024-12-15T00:00:00Z"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
